<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.R.V.L. // SECURE ACCESS TERMINAL</title>
    <meta name="description" content="S.R.V.L. Secure Access Terminal">
    <meta name="theme-color" content="#020503">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>◈</text></svg>">
    <style>
        :root {
            --bg: #020503;
            --accent: #11dd33;
            --accent-light: #33ff33;
            --accent-dark: #0a2a0a;
            --accent-glow: #00ff41;
            --text: #11dd33;
            --text-dim: #0a5a0a;
            --border: rgba(0, 255, 0, 0.3);
            --panel-bg: rgba(0, 20, 0, 0.3);
            --danger: #ff4444;
            --warning: #ffaa00;
            --info: #66ccff;
            --scanline: rgba(0, 0, 0, 0.08);
            --font-mono: 'Courier New', monospace;
        }
        [data-theme="amber"] {
            --accent: #ffb020;
            --accent-light: #ffcc44;
            --accent-dark: #2a1a00;
            --accent-glow: #ffaa00;
            --text: #ffb020;
            --text-dim: #5a4a00;
            --border: rgba(255, 170, 0, 0.3);
            --panel-bg: rgba(30, 15, 0, 0.3);
        }
        [data-theme="green"] {
            --accent: #11dd33;
            --accent-light: #33ff33;
            --accent-dark: #0a2a0a;
            --accent-glow: #00ff41;
            --text: #11dd33;
            --text-dim: #0a5a0a;
            --border: rgba(0, 255, 0, 0.3);
            --panel-bg: rgba(0, 20, 0, 0.3);
        }
        [data-section-theme="laboratory"] {
            --accent: #3399ff;
            --accent-light: #66bbff;
            --accent-dark: #0a1a2a;
            --accent-glow: #3399ff;
            --text: #3399ff;
            --text-dim: #0a1a2a;
            --border: rgba(51, 153, 255, 0.3);
            --panel-bg: rgba(0, 10, 30, 0.3);
        }
        [data-section-theme="medbay"] {
            --accent: #ff4444;
            --accent-light: #ff7777;
            --accent-dark: #2a0a0a;
            --accent-glow: #ff4444;
            --text: #ff4444;
            --text-dim: #2a0a0a;
            --border: rgba(255, 68, 68, 0.3);
            --panel-bg: rgba(30, 0, 0, 0.3);
        }
        [data-section-theme="armory"] {
            --accent: #ff8800;
            --accent-light: #ffaa44;
            --accent-dark: #2a1a00;
            --accent-glow: #ff8800;
            --text: #ff8800;
            --text-dim: #2a1a00;
            --border: rgba(255, 136, 0, 0.3);
            --panel-bg: rgba(30, 15, 0, 0.3);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: var(--font-mono);
            color: var(--text);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            min-height: 100vh;
        }
        body.animating {
            animation: crtFlicker 4s infinite;
        }
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--scanline) 2px, var(--scanline) 4px);
        }
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
        }
        .crt-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 97;
            opacity: 0.03;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 128px 128px;
        }
        .damaged-corners {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 101;
        }
        .damaged-corner {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }
        .corner-tl {
            top: 0;
            left: 0;
            width: 80px;
            height: 60px;
            clip-path: polygon(0 0, 100% 0, 60% 40%, 0 100%);
            border-right: 1px solid var(--accent);
            border-bottom: 1px solid var(--accent);
            opacity: 0.4;
        }
        .corner-tr {
            top: 0;
            right: 0;
            width: 90px;
            height: 55px;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 40% 35%);
            border-left: 1px solid var(--accent);
            border-bottom: 1px solid var(--accent);
            opacity: 0.35;
        }
        .corner-bl {
            bottom: 0;
            left: 0;
            width: 70px;
            height: 65px;
            clip-path: polygon(0 0, 55% 60%, 0 100%, 100% 100%);
            border-right: 1px solid var(--accent);
            border-top: 1px solid var(--accent);
            opacity: 0.3;
        }
        .corner-br {
            bottom: 0;
            right: 0;
            width: 100px;
            height: 50px;
            clip-path: polygon(50% 70%, 100% 0, 100% 100%, 0 100%);
            border-left: 1px solid var(--accent);
            border-top: 1px solid var(--accent);
            opacity: 0.35;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 98;
        }
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
            opacity: 0;
            background: var(--accent);
            transition: opacity 0.1s ease;
        }
        .glitch-overlay.active {
            opacity: 0.05;
        }
        .glitch-overlay.crash {
            opacity: 0.9;
            transition: opacity 0.5s ease;
        }
        @keyframes crtFlicker {
            0%,
            100% {
                opacity: 1;
            }
            98% {
                opacity: 1;
            }
            98.5% {
                opacity: 0.8;
            }
            99% {
                opacity: 1;
            }
        }
        .hidden {
            display: none !important;
        }
        .btn {
            padding: 10px 18px;
            background: rgba(0, 40, 0, 0.4);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
            text-shadow: 0 0 10px var(--accent-glow);
            clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
            transform: translateY(0);
            box-shadow: 0 4px 0 var(--accent-dark), 0 0 15px rgba(0, 0, 0, 0.5);
            min-height: 44px;
            min-width: 44px;
        }
        .btn:hover {
            background: rgba(0, 60, 0, 0.6);
            box-shadow: 0 2px 0 var(--accent-dark), 0 0 25px var(--accent-glow);
            transform: translateY(2px);
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 var(--accent-dark), 0 0 30px var(--accent-glow);
            transition: all 0.05s ease;
        }
        .btn.full-width {
            width: 100%;
            text-align: center;
        }
        .btn.small {
            padding: 8px 14px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            min-height: 44px;
        }
        .btn.danger {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(40, 0, 0, 0.4);
        }
        .btn.success {
            border-color: var(--accent-light);
            color: var(--accent-light);
        }
        .input,
        .textarea,
        .select {
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            letter-spacing: 1px;
            clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
        }
        .input:focus,
        .textarea:focus,
        .select:focus {
            outline: none;
            border-color: var(--accent-light);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .textarea {
            resize: vertical;
            min-height: 80px;
        }
        .select option {
            background: #000;
            color: var(--accent);
        }
        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--border);
            position: relative;
            clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
        }
        .panel::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            border: 1px solid var(--border);
            pointer-events: none;
            z-index: 0;
            clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
        }
        .panel::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle at 16px 16px, var(--accent) 3px, transparent 4px), radial-gradient(circle at calc(100% - 16px) 16px, var(--accent) 3px, transparent 4px), radial-gradient(circle at 16px calc(100% - 16px), var(--accent) 3px, transparent 4px), radial-gradient(circle at calc(100% - 16px) calc(100% - 16px), var(--accent) 3px, transparent 4px);
            opacity: 0.6;
        }
        .panel-inner {
            position: relative;
            z-index: 2;
            padding: 20px;
        }
        #loginScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 30px;
            position: relative;
            z-index: 50;
        }
        .logo-icon {
            font-size: 5rem;
            color: var(--accent);
            text-shadow: 0 0 40px var(--accent-glow), 0 0 80px var(--accent-glow);
            animation: logoGlow 2s ease-in-out infinite, logoFloat 3s ease-in-out infinite;
        }
        .logo-text {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 15px;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
            animation: textFlicker 3s infinite;
        }
        .logo-subtitle {
            font-size: 0.8rem;
            letter-spacing: 8px;
            color: var(--text-dim);
        }
        @keyframes logoGlow {
            0%,
            100% {
                text-shadow: 0 0 40px var(--accent-glow), 0 0 80px var(--accent-glow);
            }
            50% {
                text-shadow: 0 0 80px var(--accent-glow), 0 0 150px var(--accent-glow), 0 0 200px var(--accent-glow);
            }
        }
        @keyframes logoFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        @keyframes textFlicker {
            0%,
            100% {
                opacity: 1;
            }
            92% {
                opacity: 1;
            }
            93% {
                opacity: 0.3;
            }
            94% {
                opacity: 1;
            }
            96% {
                opacity: 0.4;
            }
            97% {
                opacity: 1;
            }
        }
        .login-window {
            width: 650px;
            max-width: 95vw;
        }
        .code-lines {
            min-height: 120px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.8;
            margin-bottom: 15px;
        }
        .progress-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .progress-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 2px;
        }
        .progress-bar {
            height: 3px;
            background: var(--accent-dark);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            width: 0%;
            transition: width 0.3s linear;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-top: 10px;
        }
        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 5px var(--accent-glow);
            }
            50% {
                box-shadow: 0 0 15px var(--accent-glow);
            }
        }
        #mainInterface {
            display: none;
            height: 100vh;
            position: relative;
            z-index: 50;
        }
        #mainInterface.active {
            display: flex;
        }
        .sidebar {
            width: 220px;
            min-width: 220px;
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3);
            overflow-y: auto;
            transition: transform 0.3s ease;
        }
        .sidebar-logo {
            text-align: center;
            padding: 20px 10px;
            border-bottom: 1px solid var(--border);
            font-size: 1.2rem;
            letter-spacing: 5px;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 10px 0;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            text-transform: uppercase;
            min-height: 44px;
            position: relative;
        }
        .nav-item:hover {
            color: var(--accent);
            background: rgba(0, 40, 0, 0.2);
            border-left-color: var(--accent-dark);
        }
        .nav-item.active {
            color: var(--accent);
            background: rgba(0, 40, 0, 0.4);
            border-left-color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .nav-icon {
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }
        .nav-badge {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            animation: badgePulse 1s infinite;
        }
        @keyframes badgePulse {
            0%,
            100% {
                box-shadow: 0 0 5px var(--danger);
            }
            50% {
                box-shadow: 0 0 15px var(--danger);
            }
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.2);
            min-height: 50px;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .content-area.page-enter {
            opacity: 0;
            transform: translateX(20px);
        }
        .content-area.page-active {
            opacity: 1;
            transform: translateX(0);
        }
        .content-area::-webkit-scrollbar {
            width: 4px;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: var(--accent);
        }
        .section-title {
            font-size: 1.4rem;
            letter-spacing: 8px;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 20px;
            text-transform: uppercase;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            padding: 15px;
            clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 1rem;
            letter-spacing: 3px;
            color: var(--accent-light);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .card-text {
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.6;
        }
        .a4-sheet {
            background: #0a0a0a;
            border: 2px solid var(--accent);
            padding: 30px;
            max-width: 800px;
            margin: 0 auto 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7), 0 0 10px var(--accent-glow);
            position: relative;
            word-break: break-word;
        }
        .a4-sheet::before {
            content: "S.R.V.L. DOSSIER";
            position: absolute;
            top: -12px;
            left: 30px;
            background: #0a0a0a;
            padding: 0 10px;
            color: var(--accent);
            font-size: 0.7rem;
            letter-spacing: 5px;
        }
        .a4-field {
            display: flex;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.1);
            padding: 6px 0;
            font-size: 0.8rem;
        }
        .a4-label {
            width: 200px;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .a4-value {
            flex: 1;
            color: var(--text-dim);
            word-break: break-word;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .table th {
            text-align: left;
            padding: 10px;
            border-bottom: 2px solid var(--accent);
            color: var(--accent-light);
            text-transform: uppercase;
            font-size: 0.7rem;
        }
        .table td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            color: var(--text-dim);
        }
        .table tr:hover td {
            background: rgba(0, 40, 0, 0.1);
            color: var(--accent);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            width: 650px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal.anim-in {
            animation: drawWindow 0.4s ease-out;
        }
        @keyframes drawWindow {
            0% {
                clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%);
                opacity: 0;
            }
            100% {
                clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
                opacity: 1;
            }
        }
        .modal-title {
            font-size: 1.1rem;
            letter-spacing: 6px;
            color: var(--accent-light);
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .sound-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 400;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 8px 15px;
            clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
        }
        .sound-icon {
            cursor: pointer;
            font-size: 1.2rem;
            min-width: 44px;
            text-align: center;
        }
        .sound-slider {
            -webkit-appearance: none;
            width: 80px;
            height: 4px;
            background: var(--accent-dark);
            outline: none;
            cursor: pointer;
        }
        .sound-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border: 2px solid var(--accent-light);

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set, update, remove, push, onValue, off, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDV5j5TwKBIE9FgR2NvCw4akWIEXVRUJv8",
            authDomain: "srvl-cb04b.firebaseapp.com",
            databaseURL: "https://srvl-cb04b-default-rtdb.firebaseio.com",
            projectId: "srvl-cb04b",
            storageBucket: "srvl-cb04b.firebasestorage.app",
            messagingSenderId: "415152723383",
            appId: "1:415152723383:web:458d0a068a832bd4a54432",
            measurementId: "G-JC5LG9D4WC"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const state = {
            currentUser: null,
            isAdmin: false,
            isDeveloper: false,
            currentPage: 'status',
            members: [],
            membersLoaded: false,
            membersLastLoad: 0,
            soundEnabled: true,
            soundVolume: 0.3,
            theme: 'green',
            lockoutUntil: null,
            failedAttempts: 0,
            adminPassword: 'admin123',
            chatListener: null,
            activeChatRef: null,
            privateChatId: null,
            privateChatUser: null,
            privateChatListener: null,
            onlineUsers: {},
            notifications: { chat: false, mail: false },
            lastMailCount: 0,
            lastPrivateMsgCount: 0,
            offlineCache: {},
            typingTimeout: null,
        };

        // ============ АУДИО ============
        let audioCtx = null,
            masterGain = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.connect(audioCtx.destination);
                masterGain.gain.value = state.soundVolume;
            }
        }

        function playBeep(f = 800, d = 0.1, t = 'square', v = 0.1) { if (!state.soundEnabled || !audioCtx) return; try { const
                o = audioCtx.createOscillator(),
                g = audioCtx.createGain();
                o.type = t;
                o.frequency.value = f;
                g.gain.value = v;
                o.connect(g);
                g.connect(masterGain);
                o.start();
                o.stop(audioCtx.currentTime + d); } catch (e) {} }

        function sfxTyping() { playBeep(600 + Math.random() * 400, 0.03); }

        function sfxClick() { playBeep(400, 0.06); }

        function sfxUnlock() { playBeep(600, 0.1);
            setTimeout(() => playBeep(900, 0.15), 100); }

        function sfxError() { playBeep(200, 0.2, 'sawtooth'); }

        function sfxNewMessage() { playBeep(1000, 0.08, 'square', 0.07);
            setTimeout(() => playBeep(1200, 0.1, 'square', 0.08), 80); }

        function sfxNewMail() { playBeep(500, 0.1, 'triangle', 0.08);
            setTimeout(() => playBeep(700, 0.12, 'triangle', 0.08), 100); }

        // ============ БРАУЗЕРНЫЕ УВЕДОМЛЕНИЯ ============
        let notifyPermission = 'default';
        async function requestNotifyPermission() {
            if (!('Notification' in window)) return;
            if (Notification.permission === 'granted') { notifyPermission = 'granted'; return; }
            if (Notification.permission === 'denied') { notifyPermission = 'denied'; return; }
            const result = await Notification.requestPermission();
            notifyPermission = result;
        }

        function sendBrowserNotify(title, body) {
            if (notifyPermission !== 'granted' || document.hidden === false) return;
            try { new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text y="28" font-size="28">◈</text></svg>',
                    tag: 'srvl-notify' }); } catch (e) {}
        }

        // ============ DOM-УТИЛИТЫ ============
        const $ = s => document.querySelector(s);
        const $$ = s => document.querySelectorAll(s);
        const loginScreen = $('#loginScreen'),
            mainInterface = $('#mainInterface'),
            loginModal = $('#loginModal'),
            contentArea = $('#contentArea'),
            glitchOverlay = $('#glitchOverlay'),
            toastContainer = $('#toastContainer'),
            sidebar = $('#sidebar'),
            hamburgerBtn = $('#hamburgerBtn'),
            mailBadge = $('#mailBadge'),
            chatBadge = $('#chatBadge');

        hamburgerBtn.addEventListener('click', () => { sidebar.classList.toggle('open');
            sfxClick(); });
        document.addEventListener('click', (e) => { if (!sidebar.contains(e.target) && e.target !== hamburgerBtn && sidebar
                .classList.contains('open')) { sidebar.classList.remove('open'); } });

        // ============ ПАРТИКЛЫ ============
        const canvas = $('#particlesCanvas'),
            ctx = canvas.getContext('2d');
        canvas.width = innerWidth;
        canvas.height = innerHeight;
        const isMobile = innerWidth < 700;
        const particles = Array.from({ length: isMobile ? 8 : 25 }, () => ({ x: Math.random() * canvas.width, y: Math.random() *
                canvas.height, size: Math.random() * 2 + 0.5, speedY: Math.random() * 0.5 + 0.1, opacity: Math.random() * 0.5 +
                0.1 }));
        let particleFPS = isMobile ? 30 : 60;
        let lastParticleTime = 0;

        function animParticles(timestamp) {
            if (timestamp - lastParticleTime < 1000 / particleFPS) { requestAnimationFrame(animParticles); return; }
            lastParticleTime = timestamp;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const ac = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
            particles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) { p.y = canvas.height;
                    p.x = Math.random() * canvas.width; }
                const m = ac.match(/\d+/g);
                ctx.fillStyle = m ? `rgba(${m[0]},${m[1]},${m[2]},${p.opacity})` : ac;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            requestAnimationFrame(animParticles);
        }
        requestAnimationFrame(animParticles);

        // ============ ТЕМА ============
        function setTheme(t) { state.theme = t;
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('srvl-theme', t); }
        setTheme(localStorage.getItem('srvl-theme') || 'green');
        $('#themeBtn').addEventListener('click', () => { setTheme(state.theme === 'green' ? 'amber' : 'green');
            sfxClick(); });

        function setSectionTheme(section) {
            document.documentElement.removeAttribute('data-section-theme');
            if (['laboratory', 'medbay', 'armory'].includes(section)) {
                document.documentElement.setAttribute('data-section-theme', section);
            }
        }

        // ============ ЗВУК ============
        const soundSlider = $('#soundSlider'),
            soundIcon = $('#soundIcon');
        const sv = localStorage.getItem('srvl-volume');
        if (sv !== null) { state.soundVolume = parseFloat(sv);
            soundSlider.value = Math.round(state.soundVolume * 100); if (state.soundVolume === 0) { state.soundEnabled =
                false;
                soundIcon.textContent = '🔇'; } }
        soundSlider.addEventListener('input', () => { state.soundVolume = soundSlider.value / 100; if (masterGain) masterGain
                .gain.value = state.soundVolume;
            localStorage.setItem('srvl-volume', state.soundVolume);
            state.soundEnabled = state.soundVolume > 0;
            soundIcon.textContent = state.soundEnabled ? '🔊' : '🔇'; });
        soundIcon.addEventListener('click', () => { if (state.soundEnabled && state.soundVolume > 0) { state.soundEnabled =
                    false;
                soundIcon.textContent = '🔇';
                soundSlider.value = 0; if (masterGain) masterGain.gain.value = 0; } else { state.soundEnabled = true;
                state.soundVolume = 0.3;
                soundSlider.value = 30; if (masterGain) masterGain.gain.value = 0.3;
                soundIcon.textContent = '🔊'; } initAudio(); });

        function toast(msg, d = 3000) { const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            toastContainer.appendChild(t);
            setTimeout(() => { t.style.opacity = '0';
                t.style.transition = 'opacity 0.3s';
                setTimeout(() => t.remove(), 300); }, d); }

        function closeModalFast(modal) { modal.style.display = 'none';
            modal.classList.remove('active');
            setTimeout(() => modal.remove(), 50); }

        // ============ ОФФЛАЙН-КЕШ ============
        function cacheData(key, data) { state.offlineCache[key] = { data, time: Date.now() };
            try { localStorage.setItem('srvl-cache-' + key, JSON.stringify(state.offlineCache[key])); } catch (e) {} }

        function getCachedData(key) {
            if (state.offlineCache[key]) return state.offlineCache[key].data;

                    'Н/Д', status: 'active', password: '', createdAt: Date.now() }); await set(ref(db, `dossiers/${id}`),
                data); await update(ref(db, `applications/${id}`), { status: 'approved' });
                toast('АНКЕТА ОДОБРЕНА');
                sfxUnlock();
                logAction(`Одобрена анкета: ${data.name}`);
                state.membersLoaded = false;
                renderAdminTab('applications'); } catch (e) { toast('ОШИБКА');
                sfxError(); } }
        async function rejectApp(id) { try { await update(ref(db, `applications/${id}`), { status: 'rejected' });
                toast('АНКЕТА ОТКЛОНЕНА');
                logAction(`Отклонена анкета: ${id}`);
                renderAdminTab('applications'); } catch (e) { toast('ОШИБКА'); } }
        async function logAction(action) { try { await push(ref(db, 'logs'), { action, timestamp: Date.now(), user: state
                    .currentUser?.name || 'ГОСТЬ' }); const snap = await get(ref(db, 'logs')); if (snap.exists()) { const
                    data = snap.val(); const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
                    Object.keys(data).forEach(k => { if (data[k].timestamp < cutoff) remove(ref(db, `logs/${k}`)).catch(
                            () => {}); }); } } catch (e) {} }

        window.addEventListener('keydown', (e) => { if (e.key === 'Enter') { if (document.activeElement?.closest(
                    '.chat-input')) return; if (loginModal.classList.contains('active')) $('#loginBtn').click(); else if ($(
                    '#accessBtn').style.display === 'block' && !mainInterface.classList.contains('active'))
                openLoginModal(); } if (e.key === 'Escape') { if (loginModal.classList.contains('active'))
                closeLoginModal(); if (sidebar.classList.contains('open')) sidebar.classList.remove('open'); } });
        window.addEventListener('resize', () => { canvas.width = innerWidth;
            canvas.height = innerHeight; });

        const visited = sessionStorage.getItem('srvl-visited'); if (visited) { $('#skipBtn').style.display = 'block';
            $('#skipBtn').textContent = '▶ ПРОПУСТИТЬ (ВХОД)'; }
        startAnimation();
        sessionStorage.setItem('srvl-visited', '1');
        logAction('ЗАПУСК ТЕРМИНАЛА');
    </script>
</body>
</html>
